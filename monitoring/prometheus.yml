global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'sales-system'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'order-service:8081'
          - 'product-service:8082'
          - 'payment-service:8083'
          - 'notification-service:8084'
          - 'analytics-service:8085'