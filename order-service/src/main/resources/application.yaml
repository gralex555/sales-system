spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/order_db}
    username: ${DB_USERNAME:order_user}
    password: ${DB_PASSWORD:order_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: 8081

kafka:
  topics:
    order-paid: order-paid

services:
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
    connect-timeout: 2s
    read-timeout: 5s
  payment:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8083}
    connect-timeout: 2s
    read-timeout: 5s

resilience4j:
  circuitbreaker:
    instances:
      productService:
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        sliding-window-size: 10
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - com.sales.order.exception.InsufficientStockException
          - com.sales.order.exception.ProductNotAvailableException

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"

order:
  reservation-hours: 48
  expiry-check-interval-ms: 60000      # раз в минуту (для разработки)
  expiry-batch-size: 100

outbox:
  batch-size: 100
  publish-interval-ms: 1000
  cleanup:
    retention-days: 7
    batch-size: 1000
    cron: "0 0 3 * * *"